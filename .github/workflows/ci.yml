name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Audit shipped dependencies (any severity fails)
        run: npm audit --omit=dev
      # Build-only findings at low/moderate come through vite-plugin-pwa > workbox-build and have
      # no non-downgrade fix; see docs/SECURITY-EXCEPTIONS.md. High and critical still fail.
      - name: Audit build tooling
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web
      # Audit, live and HTTPS suites, on Chromium and WebKit. Real Postgres, throwaway accounts.
      - name: End-to-end tests
        run: npm run test:e2e
      # Screenshots hold test data only: every account and entry is made up by the tests.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
